# Brikke: AS3933 over SPI + ESB

CONFIG_SPI=y
CONFIG_GPIO=y

# ESB. CONFIG_ESB_CLOCK_INIT far ESB til a starte hoyfrekvensklokka
# selv - uten den kommer radioen aldri i gang.
CONFIG_ESB=y
CONFIG_CLOCK_CONTROL=y
CONFIG_ESB_CLOCK_INIT=y

# Ringbufferet er 6000 x (1 + 4) byte, pluss en utpakket kopi.
CONFIG_MAIN_STACK_SIZE=4096
